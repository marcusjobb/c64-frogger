# Kontrollerar att koden kompilerar vid varje push och pull request.
# Publicerar ingenting, det gör release.yml när man taggar.
name: Bygg

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Installera .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Bygg
        run: dotnet build src/Frogger -c Release

      # Bygger samma paket som release.yml och virusskannar dem med ClamAV.
      # Publicerar ingenting.
      - name: Bygg färdiga paket för skanning
        run: |
          dotnet publish src/Frogger -c Release -r win-x64 -o build/win-x64
          dotnet publish src/Frogger -c Release -r linux-x64 -o build/linux-x64

      - name: Virusskanna med ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet
          clamscan -r --infected build
